name: Build Windows PyInstaller App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Windows app
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --name OpenCVClinicalTools `
            --paths "." `
            --hidden-import local_form `
            --hidden-import live_reference_alignment `
            --hidden-import cv2 `
            --hidden-import numpy `
            --collect-submodules cv2 `
            --collect-data cv2 `
            detect_metal_ring_photo.py

      - name: Create zip package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\OpenCVClinicalTools" -DestinationPath "OpenCVClinicalTools-windows.zip" -Force

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: OpenCVClinicalTools-windows
          path: OpenCVClinicalTools-windows.zip
